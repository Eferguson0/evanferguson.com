<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evan Ferguson</title>
  <meta name="description" content="Projects and ventures.">
  <!-- One icon for every theme: the chip carries its own contrast, so it
       doesn't depend on what the browser paints behind it. Safari plates
       favicons in dark mode, Chrome and Firefox don't. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://evanferguson.com/">

  <!-- Link previews. og:image must be absolute, so it only resolves once
       the domain points here. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://evanferguson.com/">
  <meta property="og:title" content="Evan Ferguson">
  <meta property="og:description" content="Projects and ventures.">
  <meta property="og:image" content="https://evanferguson.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Evan Ferguson">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Evan Ferguson">
  <meta name="twitter:description" content="Projects and ventures.">
  <meta name="twitter:image" content="https://evanferguson.com/og.png">

  <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161A" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <button class="theme-btn" id="themeBtn" aria-label="Toggle colour theme">◑</button>

  <header class="masthead">
    <div class="shell">
      <h1 id="mastName"></h1>
      <p class="intro" id="intro" hidden></p>
      <nav class="contact-row" id="contactRow"></nav>
    </div>
  </header>

  <main>
    <div class="shell">
      <section class="current" id="current" hidden></section>
      <div class="timeline-head" id="timelineHead" hidden>
        <span class="label">Previously</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </main>

  <footer>
    <div class="shell">
      <div class="colophon">
        <span class="label" id="colophonName"></span>
      </div>
    </div>
  </footer>

  <script src="assets/projects.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
