<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evan Ferguson</title>
  <meta name="description" content="Projects and ventures.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <button class="theme-btn" id="themeBtn" aria-label="Toggle colour theme">◑</button>

  <header class="masthead">
    <div class="shell">
      <h1 id="mastName"></h1>
      <p class="intro" id="intro" hidden></p>
      <nav class="contact-row" id="contactRow"></nav>
    </div>
  </header>

  <main>
    <div class="shell">
      <section class="current" id="current" hidden></section>
      <div class="timeline-head" id="timelineHead" hidden>
        <span class="label">Previously</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </main>

  <footer>
    <div class="shell">
      <div class="colophon">
        <span class="label" id="colophonName"></span>
        <span class="spacer"></span>
        <span class="label">Built by hand</span>
      </div>
    </div>
  </footer>

  <script src="assets/projects.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
